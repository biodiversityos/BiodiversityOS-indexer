name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before tsc so @prisma/client types are available
      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript build
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Two cores build the image from scratch; the 10m default cuts the
          # connection mid-unpack and leaves the old container running.
          command_timeout: 40m
          # The key is pinned to one service by a forced command on the server,
          # so this value is ignored and cannot be made to deploy another one.
          script: deploy
