services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biodiversity
      POSTGRES_PASSWORD: biodiversity
      POSTGRES_DB: biodiversity_indexer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biodiversity -d biodiversity_indexer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      # Override to use the 'db' hostname inside the Docker network
      DATABASE_URL: postgresql://biodiversity:biodiversity@db:5432/biodiversity_indexer
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      bos:
        # The frontend reaches the indexer at this name. Going out through the
        # public hostname instead means DNS, hairpin NAT and nginx for a call
        # between two containers on the same host — and Docker's resolver
        # intermittently returns EAI_AGAIN on that path, which empties the map.
        aliases:
          - indexer
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bos:
    external: true
